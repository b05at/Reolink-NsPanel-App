name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # zum Anlegen der Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Das Android-SDK ist auf den GitHub-Runnern bereits vorinstalliert.
      - name: Android-SDK-Lizenzen akzeptieren
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$SDKM" --licenses > /dev/null || true

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Version ermitteln
        id: ver
        run: |
          VERSION=$(grep -m1 "versionName" app/build.gradle | sed -E "s/.*'([^']+)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk Kamera.apk

      - uses: actions/upload-artifact@v6
        with:
          name: Kamera-APK
          path: Kamera.apk

      # Jede Version als Release – Download ohne Anmeldung, ohne ZIP.
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" Kamera.apk \
            --title "Kamera ${{ steps.ver.outputs.version }} (Build ${{ github.run_number }})" \
            --notes "$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):')" \
            --target "${{ github.sha }}" \
            --latest
