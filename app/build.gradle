plugins {
    id 'com.android.application'
}

android {
    namespace 'at.reolinkpanel.viewer'
    compileSdk 34

    defaultConfig {
        applicationId 'at.reolinkpanel.viewer'
        minSdk 26          // Android 8.0
        targetSdk 28       // NSPanel Pro läuft auf Android 8.1
        // nur ARM (NSPanel Pro) – hält die APK mit VLC klein
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        versionCode 15
        versionName '2.5.1'
    }

    // Fester Debug-Schlüssel im Repo: so lassen sich neue Versionen
    // per "adb install -r" über die alte installieren.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Native Bibliotheken (VLC) komprimiert speichern – halbiert die APK-Größe
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // Ersatz-Player für RTSP-Streams, an denen ExoPlayer scheitert
    implementation 'org.videolan.android:libvlc-all:3.6.0'
}
